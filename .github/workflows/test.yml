# El sitio publicado es la rama main servida por GitHub Pages: lo que se
# mergea aquí sale en producción sin más pasos. Esto es lo único que hay
# entre un test roto y el jugador.
name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Historial completo: test/anclaje.test.js compara el validador del commit
      # al que apunta la Edge Function con el del árbol de trabajo, y para eso
      # necesita poder leer ese commit. Con el clon superficial que hace
      # checkout por defecto, ese commit no está y el test falla por no
      # encontrarlo, no por lo que vigila.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Sin dependencias: no hay npm install que hacer, ni lockfile que cachear.
      - name: Tests del motor y de la colección
        run: npm test
      # El set se genera desde el código; si el fichero commiteado no coincide,
      # es que alguien cambió una carta y no lo regeneró.
      - name: SET_DE_CARTAS.md está al día
        run: |
          node sim/set.js
          git diff --exit-code SET_DE_CARTAS.md
